<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="聊天参谋">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>聊天参谋</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#0e1116;color:#e6e9ef;font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:calc(env(safe-area-inset-bottom) + 24px);overflow-x:hidden}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:11px 16px;background:rgba(14,17,22,.9);backdrop-filter:blur(14px);border-bottom:1px solid #1b212b}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px}
.iconbtn{margin-left:auto;width:36px;height:36px;border-radius:11px;background:#1a222d;border:1px solid #26303d;color:#c3cbd8;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0}
.hamburger{margin-right:2px;width:36px;height:36px;border-radius:11px;background:#1a222d;border:1px solid #26303d;color:#c3cbd8;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0}
.htitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.htitle b{font-weight:700;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htitle small{font-size:11.5px;color:#7c8899;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htitle small.ok{color:#6ee7b7}
.drawer{position:fixed;inset:0;z-index:70}
.drawer-mask{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .22s}
.drawer.open .drawer-mask{opacity:1}
.drawer-panel{position:absolute;top:0;left:0;bottom:0;width:78vw;max-width:320px;background:#11161d;border-right:1px solid #232c38;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top)}
.drawer.open .drawer-panel{transform:none}
.drawer-head{display:flex;align-items:center;padding:14px 16px 10px;font-weight:600;font-size:15.5px;color:#cfd6e2}
.drawer-head button{margin-left:auto;background:none;border:none;color:#7c8899;font-size:24px;padding:0 4px;line-height:1}
.drawer-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 10px}
.dl{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;color:#b9c4d2;font-size:15.5px;font-weight:500;cursor:pointer}
.dl:active{background:#161d27}
.dl.on{background:#1b2b41;color:#eaf2ff;font-weight:600}
.dl .dl-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .dl-count{flex:0 0 auto;font-size:11.5px;color:#6d7b8d}
.dl.on .dl-count{color:#93c5fd}
.dl .dl-del{flex:0 0 auto;font-size:18px;color:#4f5a69;padding:0 3px;line-height:1}
.dl .dl-del:active{color:#f87171}
.drawer-empty{color:#636f80;font-size:14px;text-align:center;padding:24px 12px;line-height:1.6}
.drawer-foot{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1e2733}
.drawer-foot input{flex:1;background:#0f141b;border:1px solid #2a3542;border-radius:11px;color:#e6e9ef;padding:10px 12px;font-size:16px;outline:none}
.drawer-foot button{flex:0 0 auto;padding:10px 16px;font-size:14.5px}
main{padding:12px 14px 0;display:flex;flex-direction:column;gap:12px}
.card{background:#151a22;border:1px solid #222b37;border-radius:16px;padding:14px}
.label{display:block;font-size:12.5px;color:#8b95a5;margin:0 0 8px;letter-spacing:.3px}
.label .n{color:#5f6b7a}
textarea,input{width:100%;background:#0f141b;border:1px solid #26303d;border-radius:11px;color:#e6e9ef;padding:11px 12px;font-size:16px;font-family:inherit;outline:none}
textarea:focus,input:focus{border-color:#3b82f6}
textarea{resize:none;min-height:92px;max-height:46vh;line-height:1.6;overflow-y:auto}
.count{font-size:12px;color:#6b7686;margin:6px 0 0;min-height:15px}
.row{display:flex;gap:8px;margin-top:9px}
.row.wrap{flex-wrap:wrap}
button{font-family:inherit;font-size:15px;font-weight:600;border:none;border-radius:12px;padding:12px 15px;color:#0b0f14;background:#e6e9ef;cursor:pointer;transition:opacity .15s}
button:active{opacity:.72}
button:disabled{opacity:.42}
button.primary{flex:1;background:linear-gradient(180deg,#60a5fa,#3b82f6);color:#06101f;font-size:16px}
button.half{flex:1}
button.ghost{background:#1c2430;color:#c3cbd8;border:1px solid #2a3542}
button.ghost.danger{color:#fca5a5;border-color:#3d2b2b;background:#241a1a}
button.chipbtn{font-size:13px;font-weight:500;padding:7px 12px;background:#182029;color:#9fb0c4;border:1px solid #253141;border-radius:999px}
.hidden{display:none!important}
.who{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.who .name{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{margin-left:auto;flex:0 0 auto;font-size:11.5px;padding:3px 9px;border-radius:999px;background:#241a1a;color:#fca5a5;border:1px solid #3d2b2b}
.badge.ok{background:#12241d;color:#6ee7b7;border-color:#1e3b2e}
.msg{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #1a2029;align-items:flex-start}
.msg:last-child{border-bottom:none}
.who-tag{flex:0 0 auto;font-size:11px;padding:2px 7px;border-radius:6px;margin-top:3px;font-weight:600}
.who-tag.me{background:#12314f;color:#7dd3fc}
.who-tag.them{background:#2a1f3d;color:#c4b5fd}
.who-tag.unknown{background:#242b36;color:#93a2b5}
.msg .txt{flex:1;font-size:15.5px;line-height:1.55;word-break:break-word;color:#dfe5ee}
.msg .del{flex:0 0 auto;background:none;border:none;color:#4d5a6b;font-size:18px;padding:0 2px;line-height:1}
.empty{color:#636f80;font-size:14.5px;text-align:center;padding:14px 0}
#messages{max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#analysis{margin:0 0 15px;font-size:16.5px;color:#cfd6e2;line-height:1.65}
.reply{background:#101720;border:1px solid #243040;border-radius:13px;padding:13px;margin-bottom:9px}
.reply .txt{font-size:16.5px;line-height:1.6;color:#f0f3f8;word-break:break-word}
.reply .bar{display:flex;align-items:center;gap:8px;margin-top:10px}
.tag{font-size:11.5px;color:#93c5fd;background:rgba(59,130,246,.13);border:1px solid rgba(59,130,246,.28);padding:2px 9px;border-radius:999px}
.copy{margin-left:auto;font-size:13px;padding:7px 13px;border-radius:9px;background:#1c2632;color:#cfe0f5;border:1px solid #2c3a4a;font-weight:500}
.tip{margin:12px 0 0;font-size:13.5px;color:#8b98aa}
.regen{margin-top:14px;padding-top:14px;border-top:1px solid #1e2733}
.regen input{flex:1}
.hint{font-size:12.5px;color:#6b7686;margin:9px 0 0;line-height:1.5}
.err{color:#fca5a5;font-size:14px;margin:10px 0 0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#06101f;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);transform:translateX(-50%) translateY(12px);background:#1f2937;color:#e6e9ef;border:1px solid #334155;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:80;max-width:82vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet-body{width:100%;max-height:88vh;overflow-y:auto;background:#141a22;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);border-top:1px solid #26303d}
.sheet h2{margin:0 0 14px;font-size:17px}
.sheet label{display:block;font-size:12.5px;color:#8b95a5;margin:12px 0 6px}
.sheet hr{border:none;border-top:1px solid #1e2733;margin:16px 0}
.stats{font-size:13px;color:#7c8899;margin:10px 0 0}
</style>
</head>
<body>

<header>
  <button id="btnMenu" class="hamburger" aria-label="联系人">☰</button>
  <div class="htitle">
    <b id="currentName">聊天参谋</b>
    <small id="keyState">未配置 Key</small>
  </div>
  <button id="btnSettings" class="iconbtn" aria-label="设置">⚙</button>
</header>

<div id="drawer" class="drawer hidden" aria-hidden="true">
  <aside class="drawer-panel">
    <div class="drawer-head"><span>联系人</span><button id="btnDrawerClose" aria-label="关闭">×</button></div>
    <div id="drawerList" class="drawer-list"></div>
    <div class="drawer-foot">
      <input id="newName" placeholder="新联系人名字" autocomplete="off" maxlength="40">
      <button id="btnNewOk">添加</button>
    </div>
  </aside>
  <div class="drawer-mask" id="drawerMask"></div>
</div>

<main>
  <section class="card">
    <textarea id="input" placeholder="粘贴或输入聊天内容…&#10;一条消息一行"></textarea>
    <p id="inputCount" class="count"></p>
    <div class="row">
      <button id="btnThem" class="ghost half">对方说的</button>
      <button id="btnMe" class="ghost half">我说的</button>
    </div>
    <div class="row">
      <button id="btnPaste" class="ghost half">从剪贴板粘贴</button>
      <button id="btnBulk" class="ghost half">整段（自动判断）</button>
    </div>
    <div class="row">
      <button id="btnAnalyze" class="primary">生成建议</button>
    </div>
    <p id="err" class="err hidden"></p>
  </section>

  <section class="card" id="threadCard">
    <div class="label">聊天记录 <span id="msgCount" class="n"></span></div>
    <div id="messages"></div>
    <div class="row">
      <button id="btnClearMsgs" class="ghost half">清空记录</button>
      <button id="btnDelContact" class="ghost danger half">删除联系人</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <div class="label">对方在想什么</div>
    <p id="analysis"></p>
    <div class="label">可以这样回</div>
    <div id="replies"></div>
    <p id="tip" class="tip hidden"></p>
    <div class="regen">
      <label for="instruction">不满意？说一下想要什么效果</label>
      <div class="row">
        <input id="instruction" placeholder="再温柔点 / 更短 / 别太舔" autocomplete="off">
        <button id="btnRegen" class="ghost" style="flex:0 0 auto">重新生成</button>
      </div>
      <div class="row wrap" id="presets">
        <button class="chipbtn" data-ins="再温柔一点">再温柔一点</button>
        <button class="chipbtn" data-ins="更短、更像随口一说">更短</button>
        <button class="chipbtn" data-ins="幽默一点，带点调侃">幽默点</button>
        <button class="chipbtn" data-ins="别太主动，留点余地">别太主动</button>
        <button class="chipbtn" data-ins="换个完全不同的角度">换角度</button>
      </div>
    </div>
  </section>
</main>

<div id="sheet" class="sheet hidden">
  <div class="sheet-body">
    <h2>设置</h2>
    <label for="setBase">API 地址</label>
    <input id="setBase" placeholder="https://api.deepseek.com" autocapitalize="off" autocorrect="off">
    <label for="setKey">API Key</label>
    <input id="setKey" type="password" placeholder="sk-…" autocapitalize="off" autocorrect="off">
    <label for="setModel">模型</label>
    <input id="setModel" placeholder="deepseek-chat" autocapitalize="off" autocorrect="off">
    <p class="hint">默认调用 DeepSeek 官方接口，模型 deepseek-chat。Key 只存在这台手机的浏览器里，不会上传到任何其他地方。</p>
    <div class="row"><button id="btnSaveSettings" class="primary">保存</button></div>
    <hr>
    <div class="row"><button id="btnExport" class="ghost half">导出备份</button><button id="btnImport" class="ghost half">导入备份</button></div>
    <input id="fileImport" type="file" accept="application/json,.json" hidden>
    <p id="stats" class="stats"></p>
    <div class="row"><button id="btnCloseSheet" class="ghost">关闭</button></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict'

  var STORE = 'chatcoach.v1'
  var DEFAULTS = { baseUrl: 'https://api.deepseek.com', apiKey: '', model: 'deepseek-chat' }

  var SYSTEM_PROMPT = [
    '你是一个很懂人际关系的私人聊天参谋，帮用户回复微信。',
    '用户会给你一段和某人的聊天记录。记录里标了「我：」的是用户自己发的，标了「对方：」的是对方发的；',
    '没有标签的行是截图识别出来的原文，无法区分是谁说的，请根据内容判断。',
    '',
    '你的输出必须是一个 JSON 对象，且只有这个 JSON，不要 markdown 代码块，不要任何解释文字：',
    '{"analysis":"对对方当前态度、情绪和潜台词的判断，2-3 句，直接说人话",',
    ' "replies":[{"text":"可以直接复制发送的回复","tone":"这条的策略，2-4个字"}],',
    ' "tip":"一句提醒，比如该不该主动、什么时候发"}',
    '',
    '规则：',
    '1. replies 必须正好 3 条，策略要彼此不同（例如：稳妥推进 / 拉近关系 / 幽默化解 / 给台阶）。',
    '2. 每条回复像真人打微信，口语化，不用书面语，不加引号，不解释，不超过 45 个字。',
    '3. 不要编造聊天里没有的事实，不要建议用户去查对方隐私。',
    '4. 分析要具体到这段对话，不要套话；如果记录里有「我」发的消息，顺便点出哪句说得好、哪句掉分。'
  ].join('\n')

  var $ = function (id) { return document.getElementById(id) }
  var busy = false

  // ── 状态 ──────────────────────────────────────────────

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE)
      if (!raw) return { settings: Object.assign({}, DEFAULTS), contacts: {}, current: null }
      var p = JSON.parse(raw) || {}
      var s = p.settings || {}
      return {
        settings: {
          baseUrl: String(s.baseUrl || DEFAULTS.baseUrl),
          apiKey: String(s.apiKey || ''),
          model: String(s.model || DEFAULTS.model)
        },
        contacts: p.contacts && typeof p.contacts === 'object' ? p.contacts : {},
        current: p.current || null
      }
    } catch (e) {
      return { settings: Object.assign({}, DEFAULTS), contacts: {}, current: null }
    }
  }

  var state = loadState()

  function saveState() {
    try {
      localStorage.setItem(STORE, JSON.stringify(state))
    } catch (e) {
      toast('保存失败：浏览器存储空间不足')
    }
  }

  function ensureContact(name) {
    if (!state.contacts[name]) {
      state.contacts[name] = { messages: [], lastSuggestion: null, history: [], updatedAt: Date.now() }
    }
    return state.contacts[name]
  }

  function currentEntry() {
    if (!state.current) return null
    return state.contacts[state.current] || null
  }

  // ── 通用 UI ───────────────────────────────────────────

  function toast(msg) {
    var el = $('toast')
    el.textContent = msg
    el.className = 'toast show'
    clearTimeout(el._t)
    el._t = setTimeout(function () { el.className = 'toast' }, 1700)
  }

  function showErr(msg) {
    var el = $('err')
    if (!msg) { el.className = 'err hidden'; el.textContent = ''; return }
    el.textContent = msg
    el.className = 'err'
  }

  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(function () { toast('已复制') }, function () { fallbackCopy(t) })
      return
    }
    fallbackCopy(t)
  }

  function fallbackCopy(t) {
    var ta = document.createElement('textarea')
    ta.value = t
    ta.setAttribute('readonly', '')
    ta.style.position = 'fixed'
    ta.style.top = '-1000px'
    document.body.appendChild(ta)
    ta.select()
    ta.setSelectionRange(0, t.length)
    var ok = false
    try { ok = document.execCommand('copy') } catch (e) { ok = false }
    document.body.removeChild(ta)
    toast(ok ? '已复制，回微信粘贴' : '复制失败，请长按文字复制')
  }

  // ── 渲染 ──────────────────────────────────────────────

  function openDrawer() {
    var d = $('drawer')
    d.classList.remove('hidden')
    d.setAttribute('aria-hidden', 'false')
    void d.offsetWidth
    d.classList.add('open')
  }

  function closeDrawer() {
    var d = $('drawer')
    if (d.classList.contains('hidden')) return
    d.classList.remove('open')
    d.setAttribute('aria-hidden', 'true')
    setTimeout(function () { d.classList.add('hidden') }, 230)
  }

  function renderDrawer() {
    var box = $('drawerList')
    box.innerHTML = ''
    var names = Object.keys(state.contacts)
    if (!names.length) {
      var p = document.createElement('div')
      p.className = 'drawer-empty'
      p.textContent = '还没有联系人。在下面输个名字，点「添加」。'
      box.appendChild(p)
      return
    }
    names.forEach(function (name) {
      var c = state.contacts[name]
      var row = document.createElement('div')
      row.className = 'dl' + (name === state.current ? ' on' : '')
      row.setAttribute('role', 'button')

      var nm = document.createElement('span')
      nm.className = 'dl-name'
      nm.textContent = name
      row.appendChild(nm)

      var cnt = document.createElement('span')
      cnt.className = 'dl-count'
      cnt.textContent = (c.messages || []).length || ''
      row.appendChild(cnt)

      var del = document.createElement('span')
      del.className = 'dl-del'
      del.textContent = '×'
      del.setAttribute('aria-label', '删除 ' + name)
      del.addEventListener('click', function (e) {
        e.stopPropagation()
        removeContact(name)
      })
      row.appendChild(del)

      row.addEventListener('click', function () { switchTo(name) })
      box.appendChild(row)
    })
  }

  function renderHeader() {
    $('currentName').textContent = state.current || '聊天参谋'
    var configured = Boolean(state.settings.apiKey && state.settings.baseUrl && state.settings.model)
    var el = $('keyState')
    el.textContent = configured ? '已就绪' : '未配置 Key · 点右上角 ⚙'
    el.className = configured ? 'ok' : ''
  }

  function renderMessages() {
    var box = $('messages')
    box.innerHTML = ''
    var entry = currentEntry()
    var msgs = (entry && entry.messages) || []
    $('msgCount').textContent = msgs.length ? '共 ' + msgs.length + ' 条' : ''
    if (!msgs.length) {
      var p = document.createElement('p')
      p.className = 'empty'
      p.textContent = state.current ? '还没有记录。把聊天内容粘到上面，点「对方说的」或「我说的」。' : '先新建一个联系人。'
      box.appendChild(p)
      return
    }
    msgs.slice(-60).forEach(function (m, i) {
      var row = document.createElement('div')
      row.className = 'msg'

      var tag = document.createElement('span')
      tag.className = 'who-tag ' + (m.role || 'unknown')
      tag.textContent = m.role === 'me' ? '我' : m.role === 'them' ? 'TA' : '?'
      row.appendChild(tag)

      var txt = document.createElement('div')
      txt.className = 'txt'
      txt.textContent = m.text
      row.appendChild(txt)

      var del = document.createElement('button')
      del.className = 'del'
      del.textContent = '×'
      del.setAttribute('aria-label', '删除这条')
      var realIndex = msgs.length - Math.min(msgs.length, 60) + i
      del.addEventListener('click', function () {
        var list = state.contacts[state.current].messages
        if (realIndex >= 0 && realIndex < list.length) {
          list.splice(realIndex, 1)
          saveState()
          renderAll()
        }
      })
      row.appendChild(del)

      box.appendChild(row)
    })
  }

  function renderResult() {
    var entry = currentEntry()
    var sug = entry && entry.lastSuggestion
    if (!sug || (!sug.analysis && (!sug.replies || !sug.replies.length))) {
      $('result').className = 'card hidden'
      return
    }
    $('result').className = 'card'
    $('analysis').textContent = sug.analysis || '（这次没给分析）'

    var box = $('replies')
    box.innerHTML = ''
    var replies = sug.replies || []
    if (!replies.length) {
      var p = document.createElement('p')
      p.className = 'empty'
      p.textContent = '模型这次没按格式返回，把上面那段当建议看吧，可以重新生成再试。'
      box.appendChild(p)
    }
    replies.forEach(function (r) {
      var card = document.createElement('div')
      card.className = 'reply'
      var txt = document.createElement('div')
      txt.className = 'txt'
      txt.textContent = r.text
      card.appendChild(txt)
      var bar = document.createElement('div')
      bar.className = 'bar'
      if (r.tone) {
        var tag = document.createElement('span')
        tag.className = 'tag'
        tag.textContent = r.tone
        bar.appendChild(tag)
      }
      var btn = document.createElement('button')
      btn.className = 'copy'
      btn.textContent = '复制'
      btn.addEventListener('click', function () { copyText(r.text) })
      bar.appendChild(btn)
      card.appendChild(bar)
      box.appendChild(card)
    })

    var tipEl = $('tip')
    if (sug.tip) { tipEl.textContent = sug.tip; tipEl.className = 'tip' }
    else { tipEl.textContent = ''; tipEl.className = 'tip hidden' }
  }

  function renderAll() {
    renderDrawer()
    renderHeader()
    renderMessages()
    renderResult()
  }

  // ── 联系人操作 ─────────────────────────────────────────

  function switchTo(name) {
    state.current = name
    saveState()
    closeDrawer()
    renderAll()
  }

  function createContact() {
    var name = $('newName').value.trim().slice(0, 40)
    if (!name) { toast('先起个名字'); return }
    if (state.contacts[name]) { toast('已经有这个联系人了'); return }
    ensureContact(name)
    state.current = name
    $('newName').value = ''
    saveState()
    renderAll()
    closeDrawer()
    toast('已新建：' + name)
  }

  function deleteContact() {
    if (!state.current) { toast('先选一个联系人'); return }
    removeContact(state.current)
  }

  function removeContact(name) {
    if (!name || !state.contacts[name]) return
    if (!window.confirm('删除「' + name + '」和它的全部聊天记录？这个操作不能撤销。')) return
    delete state.contacts[name]
    var left = Object.keys(state.contacts)
    if (state.current === name) state.current = left.length ? left[0] : null
    saveState()
    renderAll()
    toast('已删除：' + name)
  }

  function clearMessages() {
    if (!state.current) { toast('先选一个联系人'); return }
    var entry = currentEntry()
    if (!entry || !entry.messages.length) { toast('本来就没有记录'); return }
    if (!window.confirm('清空「' + state.current + '」的聊天记录？建议会保留。')) return
    entry.messages = []
    entry.lastSuggestion = null
    entry.history = []
    saveState()
    renderAll()
    toast('已清空记录')
  }

  // ── 消息操作 ───────────────────────────────────────────

  // 微信/系统复制出来的换行并不统一：\r\n、单独 \r、U+2028/U+2029 都见过，
  // 少认一种就会把整段当成一行，所以这里全部当分隔符。
  var LINE_BREAK = /\r\n|\r|\n|\u2028|\u2029/

  function cleanLine(s) {
    return String(s == null ? '' : s).replace(/[\u200b\ufeff]/g, '').trim()
  }

  function updateCount() {
    var v = $('input').value
    if (!v) { $('inputCount').textContent = ''; return }
    var n = v.split(LINE_BREAK).filter(function (s) { return cleanLine(s).length > 0 }).length
    $('inputCount').textContent = '共 ' + n + ' 行 · ' + v.length + ' 字'
  }

  function autoGrow() {
    var el = $('input')
    el.style.height = 'auto'
    var max = Math.round(window.innerHeight * 0.46)
    el.style.height = Math.min(el.scrollHeight, max) + 'px'
  }

  function insertIntoInput(text) {
    var el = $('input')
    var start = typeof el.selectionStart === 'number' ? el.selectionStart : el.value.length
    var end = typeof el.selectionEnd === 'number' ? el.selectionEnd : el.value.length
    var v = el.value
    el.value = v.slice(0, start) + text + v.slice(end)
    var pos = start + text.length
    try { el.selectionStart = el.selectionEnd = pos } catch (e) { /* 某些环境不支持选区 */ }
    updateCount()
    autoGrow()
  }

  function addMessages(role, raw) {
    if (!state.current) { toast('先新建一个联系人'); return }
    var lines = String(raw || '').split(LINE_BREAK).map(cleanLine).filter(function (s) { return s.length > 0 })
    if (!lines.length) { toast('先粘点内容进来'); return }
    var entry = ensureContact(state.current)
    var now = Date.now()
    lines.forEach(function (line) {
      entry.messages.push({ role: role, text: line.slice(0, 800), at: now })
    })
    if (entry.messages.length > 200) entry.messages = entry.messages.slice(-200)
    entry.updatedAt = now
    $('input').value = ''
    updateCount()
    autoGrow()
    showErr('')
    saveState()
    renderAll()
    toast('已记下 ' + lines.length + ' 条' + (role === 'me' ? '（我）' : role === 'them' ? '（对方）' : ''))
  }

  // ── 生成 ──────────────────────────────────────────────

  function buildPrompt(entry, instruction) {
    var lines = entry.messages.map(function (m) {
      if (m.role === 'me') return '我：' + m.text
      if (m.role === 'them') return '对方：' + m.text
      return m.text
    })
    var parts = [
      '联系人：' + state.current,
      '',
      '【聊天记录】（按时间顺序）',
      lines.join('\n')
    ]
    if (instruction) parts.push('', '【用户这次的额外要求】', String(instruction).slice(0, 300))
    var prev = entry.lastSuggestion
    if (prev && prev.replies && prev.replies.length) {
      parts.push('', '【你上一次给的建议（这次不要重复，要明显不同）】')
      prev.replies.forEach(function (r) { parts.push('- ' + r.text) })
    }
    parts.push('', '现在按格式要求输出 JSON。')
    return parts.join('\n')
  }

  function extractJson(text) {
    var s = String(text || '').trim()
    s = s.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim()
    var a = s.indexOf('{')
    var b = s.lastIndexOf('}')
    if (a === -1 || b === -1 || b <= a) return null
    try { return JSON.parse(s.slice(a, b + 1)) } catch (e) { return null }
  }

  function normalizeSuggestion(obj, fallbackText) {
    var out = { analysis: '', replies: [], tip: '' }
    if (obj) {
      if (typeof obj.analysis === 'string') out.analysis = obj.analysis.trim()
      if (typeof obj.tip === 'string') out.tip = obj.tip.trim()
      if (Array.isArray(obj.replies)) {
        out.replies = obj.replies.map(function (r) {
          if (typeof r === 'string') return { text: r.trim(), tone: '' }
          if (r && typeof r.text === 'string') return { text: r.text.trim(), tone: String(r.tone || '').trim().slice(0, 8) }
          return null
        }).filter(function (r) { return r && r.text }).slice(0, 4)
      }
    }
    if (!out.replies.length) {
      var plain = String(fallbackText || '').trim()
      if (plain) out.analysis = out.analysis || plain.slice(0, 600)
    }
    return out
  }

  async function callApi(prompt) {
    var s = state.settings
    var base = String(s.baseUrl || '').replace(/\/+$/, '')
    var url = base + '/chat/completions'
    var controller = new AbortController()
    var timer = setTimeout(function () { controller.abort() }, 90000)
    try {
      var res = await fetch(url, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          authorization: 'Bearer ' + s.apiKey
        },
        body: JSON.stringify({
          model: s.model,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user', content: prompt }
          ],
          temperature: 1.0,
          max_tokens: 1200
        }),
        signal: controller.signal
      })
      if (!res.ok) {
        var body = ''
        try { body = await res.text() } catch (e) { body = '' }
        var hint = ''
        if (res.status === 401) hint = '（Key 不对或已失效）'
        else if (res.status === 402) hint = '（账户余额不足）'
        else if (res.status === 429) hint = '（请求太频繁，等几秒再试）'
        throw new Error('接口返回 ' + res.status + hint + (body ? '：' + body.slice(0, 160) : ''))
      }
      var data = await res.json()
      var content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content
      if (!content) throw new Error('接口没返回内容')
      return String(content)
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('请求超时（90 秒），检查网络或换个模型')
      if (e instanceof TypeError) throw new Error('连不上接口：可能是没网，或者这个地址不允许浏览器直接调用（CORS）。DeepSeek 官方接口是允许的。')
      throw e
    } finally {
      clearTimeout(timer)
    }
  }

  function setBusy(on) {
    busy = on
    var b = $('btnAnalyze')
    b.disabled = on
    b.innerHTML = on ? '<span class="spin"></span>想一下…' : '生成建议'
    $('btnRegen').disabled = on
  }

  async function analyze(instruction) {
    if (busy) return
    if (!state.current) { showErr('先新建一个联系人'); return }
    var entry = currentEntry()
    if (!entry || !entry.messages.length) { showErr('先把聊天内容记下来'); return }
    var s = state.settings
    if (!s.apiKey || !s.baseUrl || !s.model) {
      showErr('还没配置 API Key，点右上角 ⚙ 填一下')
      openSheet()
      return
    }

    showErr('')
    setBusy(true)
    try {
      var prompt = buildPrompt(entry, instruction)
      var text = await callApi(prompt)
      var sug = normalizeSuggestion(extractJson(text), text)
      sug.at = Date.now()
      sug.instruction = instruction || ''
      entry.lastSuggestion = sug
      entry.history = [{ suggestion: sug, instruction: instruction || '', at: sug.at }].concat(entry.history || []).slice(0, 20)
      saveState()
      renderResult()
      $('result').scrollIntoView({ behavior: 'smooth', block: 'start' })
    } catch (e) {
      showErr(e && e.message ? e.message : '生成失败')
    } finally {
      setBusy(false)
    }
  }

  // ── 设置 / 备份 ────────────────────────────────────────

  function openSheet() {
    $('setBase').value = state.settings.baseUrl
    $('setKey').value = state.settings.apiKey
    $('setModel').value = state.settings.model
    var count = Object.keys(state.contacts).length
    var msgs = 0
    Object.keys(state.contacts).forEach(function (k) { msgs += (state.contacts[k].messages || []).length })
    var bytes = 0
    try { bytes = new Blob([JSON.stringify(state)]).size } catch (e) { bytes = 0 }
    $('stats').textContent = '本地已存：' + count + ' 个联系人 / ' + msgs + ' 条消息 / 约 ' + Math.max(1, Math.round(bytes / 1024)) + ' KB'
    $('sheet').className = 'sheet'
  }

  function closeSheet() { $('sheet').className = 'sheet hidden' }

  function saveSettings() {
    var base = $('setBase').value.trim()
    var key = $('setKey').value.trim()
    var model = $('setModel').value.trim()
    if (!base) { toast('API 地址不能为空'); return }
    if (!/^https?:\/\//i.test(base)) { toast('API 地址要以 http(s):// 开头'); return }
    state.settings.baseUrl = base.replace(/\/+$/, '')
    state.settings.apiKey = key
    state.settings.model = model || DEFAULTS.model
    saveState()
    renderHeader()
    closeSheet()
    toast(key ? '已保存' : '已保存（没有填 Key）')
  }

  function exportBackup() {
    var data = JSON.stringify(state, null, 2)
    var blob = new Blob([data], { type: 'application/json' })
    var url = URL.createObjectURL(blob)
    var a = document.createElement('a')
    var d = new Date()
    var pad = function (n) { return n < 10 ? '0' + n : '' + n }
    a.href = url
    a.download = '聊天参谋备份-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json'
    document.body.appendChild(a)
    a.click()
    document.body.removeChild(a)
    setTimeout(function () { URL.revokeObjectURL(url) }, 2000)
    toast('备份已生成')
  }

  function importBackup(file) {
    var reader = new FileReader()
    reader.onload = function () {
      try {
        var p = JSON.parse(String(reader.result))
        if (!p || typeof p !== 'object' || !p.contacts) throw new Error('格式不对')
        if (!window.confirm('导入会覆盖当前所有联系人和记录，确定？')) return
        var s = p.settings || {}
        state = {
          settings: {
            baseUrl: String(s.baseUrl || DEFAULTS.baseUrl),
            apiKey: String(s.apiKey || ''),
            model: String(s.model || DEFAULTS.model)
          },
          contacts: p.contacts,
          current: p.current && p.contacts[p.current] ? p.current : (Object.keys(p.contacts)[0] || null)
        }
        saveState()
        renderAll()
        closeSheet()
        toast('导入完成')
      } catch (e) {
        toast('导入失败：' + (e.message || '文件不对'))
      }
    }
    reader.readAsText(file)
  }

  // ── 事件绑定 ───────────────────────────────────────────

  $('btnMenu').addEventListener('click', openDrawer)
  $('btnDrawerClose').addEventListener('click', closeDrawer)
  $('drawerMask').addEventListener('click', closeDrawer)
  $('btnSettings').addEventListener('click', openSheet)
  $('btnCloseSheet').addEventListener('click', closeSheet)
  $('btnSaveSettings').addEventListener('click', saveSettings)
  $('btnExport').addEventListener('click', exportBackup)
  $('btnImport').addEventListener('click', function () { $('fileImport').click() })
  $('fileImport').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]
    if (f) importBackup(f)
    e.target.value = ''
  })
  $('sheet').addEventListener('click', function (e) {
    if (e.target === $('sheet')) closeSheet()
  })

  $('btnNewOk').addEventListener('click', createContact)
  $('newName').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); createContact() }
  })

  $('input').addEventListener('input', function () { updateCount(); autoGrow() })

  // iOS 从微信粘大段文本时，默认粘贴可能只落一部分（尤其中间有空行）。
  // 自己接管 paste、只取纯文本、按光标插入，绕开系统那套富文本处理。
  $('input').addEventListener('paste', function (e) {
    var cd = e.clipboardData || window.clipboardData
    if (!cd) return
    var text = ''
    try { text = cd.getData('text/plain') || cd.getData('text') || '' } catch (err) { text = '' }
    if (!text) return
    e.preventDefault()
    insertIntoInput(text)
  })

  $('btnPaste').addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      toast('系统不让直接读剪贴板，请长按输入框粘贴')
      return
    }
    navigator.clipboard.readText().then(function (t) {
      if (!t) { toast('剪贴板是空的'); return }
      var cur = $('input').value
      var needNl = cur && !/[\n\r]$/.test(cur)
      insertIntoInput((needNl ? '\n' : '') + t)
      var n = t.split(LINE_BREAK).filter(function (s) { return cleanLine(s).length > 0 }).length
      toast('已粘贴 ' + n + ' 行')
    }).catch(function () {
      toast('读剪贴板被拒绝，长按输入框手动粘贴')
    })
  })

  $('btnThem').addEventListener('click', function () { addMessages('them', $('input').value) })
  $('btnMe').addEventListener('click', function () { addMessages('me', $('input').value) })
  $('btnBulk').addEventListener('click', function () { addMessages('unknown', $('input').value) })
  $('btnAnalyze').addEventListener('click', function () { analyze('') })
  $('btnRegen').addEventListener('click', function () {
    var ins = $('instruction').value.trim()
    analyze(ins)
    $('instruction').value = ''
  })
  $('instruction').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('btnRegen').click() }
  })
  Array.prototype.forEach.call($('presets').children, function (btn) {
    btn.addEventListener('click', function () {
      $('instruction').value = btn.getAttribute('data-ins') || ''
      $('btnRegen').click()
    })
  })

  $('btnClearMsgs').addEventListener('click', clearMessages)
  $('btnDelContact').addEventListener('click', deleteContact)

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { state = loadState(); renderAll() }
  })

  // ── 启动 ──────────────────────────────────────────────

  if (state.current && !state.contacts[state.current]) state.current = null
  if (!state.current) {
    var names = Object.keys(state.contacts)
    if (names.length) { state.current = names[0]; saveState() }
  }
  renderAll()
  updateCount()
  autoGrow()
})();
</script>
</body>
</html>
